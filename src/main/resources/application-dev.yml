spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN}
    app-id: ${WHATSAPP_APP_ID}
    app-secret: ${WHATSAPP_APP_SECRET}
    credential-encryption-key: ${WHATSAPP_CREDENTIAL_ENCRYPTION_KEY}
  storage:
    endpoint: ${STORAGE_ENDPOINT}
    bucket: ${STORAGE_BUCKET}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
  email:
    from-address: ${SES_FROM_EMAIL}
    from-name: ${SES_FROM_NAME}
    accept-invite-url-template: ${INVITE_ACCEPT_URL_TEMPLATE}

management:
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    # %X pulls the MDC entries RequestIdFilter sets. Without this the ids are
    # recorded and then thrown away at render time, which is the confusing
    # half-state of "tracing is wired up but I cannot see it".
    level: "%5p [req=%X{requestId:-none} cold=%X{coldStart:-?}]"
