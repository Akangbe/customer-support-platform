
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:local-dev-verify-token}
    app-id: ${WHATSAPP_APP_ID:local-dev-app-id}
    app-secret: ${WHATSAPP_APP_SECRET:local-dev-app-secret-change-me}
    credential-encryption-key: ${WHATSAPP_CREDENTIAL_ENCRYPTION_KEY:o7ZaFx2pz17MiVp617XusGgJllHTilKy6qGh5Wk7MPM=}
    graph-api-base-url: ${WHATSAPP_GRAPH_API_BASE_URL:https://graph.facebook.com/v21.0}
    # true swaps MetaWhatsAppGateway for MockWhatsAppGateway: every send
    # "succeeds" with a wamid.MOCK- id and nothing reaches Meta. For demos
    # and tenant integration testing. Deliberately absent from
    # application-prod.yml so production can't land here by accident.
    mock: ${WHATSAPP_MOCK:false}
  rate-limit:
    # false = process-local counters (InMemoryRateLimiter), which is correct
    # for the single instance ADR-018 assumes and needs no Redis running.
    # Turn on together with spring.data.redis.* the moment a second backend
    # instance exists, or each instance grants the full budget separately.
    redis-enabled: ${APP_RATE_LIMIT_REDIS_ENABLED:false}
  scheduling:
    enabled: ${APP_SCHEDULING_ENABLED:true}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${STORAGE_BUCKET:attachments-local}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    presigned-url-ttl: ${STORAGE_PRESIGNED_URL_TTL:PT15M}
  email:
    from-address: ${SES_FROM_EMAIL:invites@localhost.dev}
    from-name: ${SES_FROM_NAME:Support Platform}
    accept-invite-url-template: ${INVITE_ACCEPT_URL_TEMPLATE:http://localhost:3000/accept-invite?token=%s}

server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: customer-support-platform
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Tied to the same switch as the rate limiter: with the in-memory
    # limiter there is no Redis to be healthy, and an unconditional Redis
    # indicator would report the whole service DOWN over a dependency
    # nothing is using.
    redis:
      enabled: ${APP_RATE_LIMIT_REDIS_ENABLED:false}
