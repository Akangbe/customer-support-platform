spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  cors:
    # No default here on purpose: an unset origin should fail loudly
    # (CORS rejecting every request) rather than silently falling back
    # to the localhost:3000 default meant for local dev only.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN}
    app-id: ${WHATSAPP_APP_ID}
    app-secret: ${WHATSAPP_APP_SECRET}
    credential-encryption-key: ${WHATSAPP_CREDENTIAL_ENCRYPTION_KEY}
  storage:
    endpoint: ${STORAGE_ENDPOINT}
    bucket: ${STORAGE_BUCKET}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
  email:
    from-address: ${SES_FROM_EMAIL}
    from-name: ${SES_FROM_NAME}
    accept-invite-url-template: ${INVITE_ACCEPT_URL_TEMPLATE}

server:
  servlet:
    session:
      cookie:
        # The Next.js frontend is on a different origin (e.g. Vercel) than
        # this backend (e.g. Render) — a cross-site fetch/XHR only carries
        # the session cookie back if it's SameSite=None, and browsers
        # require Secure for any SameSite=None cookie. Local/dev profiles
        # deliberately don't set this: Secure cookies are dropped outright
        # over plain HTTP, which is what local dev runs on.
        secure: true
        same-site: none

management:
  endpoint:
    health:
      show-details: never

# Structured (JSON) logging, built into Spring Boot 4 -- no logstash-encoder
# dependency and no logback-spring.xml needed. Render ships stdout to its log
# stream as lines; as JSON those lines become queryable instead of needing a
# regex per question.
#
# ECS is chosen over the logstash format because it names the trace field
# consistently and is what most log backends parse without a custom mapping.
# MDC entries (requestId, coldStart, sinceReadyS -- see RequestIdFilter) are
# included automatically, which is the point: every line emitted while
# handling a request carries the id that ties it to the others.
logging:
  structured:
    format:
      console: ecs
