spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/support_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: true

logging:
  level:
    com.supportplatform: DEBUG
  pattern:
    # See application-prod.yml: prod emits ECS JSON, where MDC is structural.
    # Locally the same entries have to be named in the pattern to be visible.
    level: "%5p [req=%X{requestId:-none} cold=%X{coldStart:-?}]"
